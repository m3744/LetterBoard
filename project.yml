# XcodeGen 專案設定：在 Mac 上執行 `xcodegen generate` 產生 LetterBoard.xcodeproj
name: LetterBoard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant

packages:
  Megrez:
    url: https://github.com/vChewing/Megrez
    exactVersion: 5.0.9

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # 在 Xcode 的 Signing & Capabilities 選自己的 Team，或在這裡填 Team ID
    DEVELOPMENT_TEAM: ""

targets:
  LetterBoard:
    type: application
    platform: iOS
    sources:
      - LetterBoard
    dependencies:
      - package: Megrez
    info:
      path: LetterBoard/Info.plist
      properties:
        CFBundleDisplayName: 字母溝通板
        CFBundleDevelopmentRegion: zh-Hant
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.letterboard
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  LetterBoardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LetterBoardTests
    dependencies:
      - target: LetterBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.letterboard.tests
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LetterBoard:
    build:
      targets:
        LetterBoard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LetterBoardTests
